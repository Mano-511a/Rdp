image: Visual Studio 2022

init:
- ps: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
- ps: netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
- ps: net user RDP P@ssw0rd123 /add
- ps: net localgroup Administrators RDP /add

install:
- ps: Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
- ps: $process = Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url localhost:3389" -NoNewWindow -PassThru
- ps: Start-Sleep -Seconds 15
- ps: $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
- ps: $url = $response.tunnels[0].public_url
- ps: Write-Host "RDP Address: $url" -ForegroundColor Green
- ps: while ($true) { Start-Sleep -Seconds 300 }
