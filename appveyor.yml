image: Visual Studio 2022

init:
- ps: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
- ps: netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
- ps: net user RDP P@ssw0rd123 /add
- ps: net localgroup Administrators RDP /add

install:
- ps: Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
- ps: Expand-Archive -Path "ngrok.zip" -DestinationPath "."
- ps: Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
- ps: Start-Sleep -Seconds 10
- ps: |
    $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
    $url = $response.tunnels[0].public_url
    Write-Host "RDP Address: $url" -ForegroundColor Green
- ps: while ($true) { Start-Sleep -Seconds 300 }
