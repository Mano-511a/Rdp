Name: RDP

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download and Setup ngrok
        shell: pwsh
        run: |
          # 1. تحميل الملف
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-windows-amd64.zip -OutFile ngrok.zip
          
          # 2. فك الضغط مباشرة في المجلد الحالي (استخدام -DestinationPath . ضروري)
          Expand-Archive -Path ngrok.zip -DestinationPath . -Force
          
          # 3. تفعيل التوكن (تأكد من وضع التوكن الخاص بك هنا)
          ./ngrok.exe authtoken YOUR_AUTH_TOKEN

      - name: Enable RDP and Start ngrok
        shell: pwsh
        run: |
          # إعداد المستخدم والصلاحيات
          net user kamel123 MyStrong123 /add
          net localgroup administrators kamel123 /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # تشغيل السيرفر
          ./ngrok.exe tcp 3389
          
